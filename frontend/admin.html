<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>테이블오더 · 관리자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Jua&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <!-- 로그인 -->
    <section id="login-view" class="login-wrap hidden">
      <div class="card login-card">
        <h2>관리자 로그인</h2>
        <div class="grid">
          <input id="login-store" placeholder="매장 ID" value="store001" />
          <input id="login-user" placeholder="사용자명" value="admin" />
          <input id="login-pw" type="password" placeholder="비밀번호" />
          <button id="login-submit">로그인</button>
          <div id="login-error" class="muted"></div>
        </div>
      </div>
    </section>

    <!-- 관리자 앱 -->
    <section id="admin-view" class="hidden">
      <div class="topbar">
        <div class="title">🧑‍🍳 관리자</div>
        <div class="row">
          <span id="conn" class="badge">연결 중…</span>
          <button id="admin-pw" class="secondary">비밀번호 변경</button>
          <button id="logout" class="secondary">로그아웃</button>
        </div>
      </div>

      <div class="container">
        <div class="tabs">
          <button data-tab="dashboard" class="active">대시보드</button>
          <button data-tab="tables">테이블 관리</button>
          <button data-tab="menus">메뉴 관리</button>
        </div>

        <!-- 대시보드 -->
        <div id="tab-dashboard">
          <div id="tables-grid" class="grid tables-grid"></div>
        </div>

        <!-- 테이블 관리 -->
        <div id="tab-tables" class="hidden">
          <div class="card" style="margin-bottom: 1rem">
            <h3>테이블 등록</h3>
            <div class="row">
              <input id="new-table-number" placeholder="테이블 번호 (예: T7)" />
              <input id="new-table-pw" placeholder="비밀번호" />
              <button id="new-table-submit">등록</button>
            </div>
          </div>
          <div class="card">
            <h3>등록된 테이블</h3>
            <table class="data">
              <thead>
                <tr><th>번호</th><th>생성일</th><th></th></tr>
              </thead>
              <tbody id="tables-config-body"></tbody>
            </table>
          </div>
        </div>

        <!-- 메뉴 관리 -->
        <div id="tab-menus" class="hidden">
          <div class="card" style="margin-bottom: 1rem">
            <h3>카테고리 추가</h3>
            <div class="row">
              <input id="new-cat-name" placeholder="카테고리 이름" />
              <input id="new-cat-order" type="number" placeholder="노출순" value="0" style="max-width: 120px" />
              <button id="new-cat-submit">추가</button>
            </div>
          </div>
          <div class="card" style="margin-bottom: 1rem">
            <h3>메뉴 추가</h3>
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 0.6rem">
              <input id="new-menu-name" placeholder="메뉴 이름" />
              <input id="new-menu-price" type="number" placeholder="가격(원)" />
              <select id="new-menu-cat"></select>
              <input id="new-menu-order" type="number" placeholder="노출순" value="0" />
              <input id="new-menu-desc" placeholder="설명(선택)" />
              <input id="new-menu-img" placeholder="이미지 URL(선택)" />
            </div>
            <div style="margin-top: 0.6rem"><button id="new-menu-submit">메뉴 추가</button></div>
          </div>
          <div id="menu-manage-root" class="grid"></div>
        </div>
      </div>
    </section>

    <!-- 모달 -->
    <div id="modal-backdrop" class="modal-backdrop hidden">
      <div class="modal">
        <div class="row space">
          <h2 id="modal-title">상세</h2>
          <button id="modal-close" class="secondary">닫기</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/admin.js"></script>
  </body>
</html>
